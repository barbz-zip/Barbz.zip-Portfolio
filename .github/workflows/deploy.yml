name: barbz-zip — GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate and build barbz-zip
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: pnpm@11.25.0
          build-cmd: pnpm check && pnpm test && pnpm build
        env:
          GITHUB_PAGES: 'true'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish barbz-zip
        id: deployment
        uses: actions/deploy-pages@v5
